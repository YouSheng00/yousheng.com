<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro — CompassStu</title>
  <!-- CompassStu card intro, retheme v3 — self-contained for iframe embed on
       the portfolio index. Replaces the v1 explosion/compass-dial sequence.

       Design doctrine (Retheme/retheme.md):
       · The card is a v3 DARK CHAPTER — #14102B ground, aurora rising from the
         bottom edge, "night with city lights, not a void". Dark in both themes.
       · Guided Light motion: one settle (lockup rises once), then only light
         moves — the aurora breathes (24s), a light pulse sweeps the tick-rule
         (8s), a mono bearing readout ticks one revolution per 36s.
       · Nothing bounces, spins, scales, shakes, or reloads. No warm spectrum.
       · Runs at every card size the grid produces: ratio 1.78 desktop → 1.3
         phone — all sizing is viewport-relative (the iframe IS the card). -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700&f[]=switzer@500&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --chapter-bg: #14102B;
      --chapter-muted: rgba(255, 255, 255, 0.66);
      --chapter-hairline: rgba(255, 255, 255, 0.13);
      --brand-dark: #8B6FFF;          /* v3 --brand, dark-theme value */
      --spec-violet: #8B5CF6;
      --spec-indigo: #4F46E5;
      --spec-cyan: #22D3EE;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'Switzer', -apple-system, sans-serif;
      --display: 'Cabinet Grotesk', var(--sans);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--chapter-bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── The aurora — one light source, rising from the bottom edge.
         Painted once (blur is static); only transform animates. ──── */
    .aurora {
      position: absolute;
      left: -12%; right: -12%;
      bottom: -34%;
      height: 90%;
      background:
        radial-gradient(58% 72% at 30% 88%, rgba(79, 70, 229, 0.88), transparent 72%),
        radial-gradient(48% 62% at 66% 96%, rgba(139, 92, 246, 0.72), transparent 72%),
        radial-gradient(34% 52% at 92% 80%, rgba(34, 211, 238, 0.5), transparent 72%);
      filter: blur(clamp(14px, 4vmin, 30px));
      opacity: 0;
      transform: translateY(4%) scale(1);
      animation:
        aurora-in 1.4s ease-out 0.1s 1 forwards,
        aurora-drift 24s ease-in-out 1.5s infinite alternate;
      will-change: transform, opacity;
    }
    @keyframes aurora-in {
      to { opacity: 1; }
    }
    @keyframes aurora-drift {
      0%   { transform: translateY(4%)  translateX(0)    scale(1); }
      100% { transform: translateY(0%)  translateX(2.5%) scale(1.06); }
    }

    /* ── The bloom — a contained glow behind the lockup, occluded by it.
         Blooms in once, then breathes on an 8s cycle. ──────────────── */
    .bloom {
      position: absolute;
      top: 50%; left: 50%;
      width: min(72vmin, 560px);
      aspect-ratio: 1.6;
      transform: translate(-50%, -56%) scale(0.7);
      background: radial-gradient(50% 50% at 50% 50%,
        rgba(139, 111, 255, 0.34) 0%,
        rgba(99, 82, 232, 0.18) 40%,
        rgba(34, 211, 238, 0.05) 68%,
        transparent 80%);
      filter: blur(clamp(10px, 3vmin, 22px));
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
      animation:
        bloom-in 1.3s cubic-bezier(0.2, 0.6, 0.3, 1) 0.55s 1 forwards,
        bloom-breathe 8s ease-in-out 1.85s infinite alternate;
      will-change: transform, opacity;
    }
    @keyframes bloom-in {
      to { opacity: 0.9; transform: translate(-50%, -56%) scale(1); }
    }
    @keyframes bloom-breathe {
      0%   { opacity: 0.72; transform: translate(-50%, -56%) scale(1); }
      100% { opacity: 1;    transform: translate(-50%, -56%) scale(1.08); }
    }

    /* ── City lights — three faint specks twinkling in the aurora ── */
    .speck {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(210, 195, 255, 0.9);
      box-shadow: 0 0 8px rgba(139, 111, 255, 0.8);
      opacity: 0;
      pointer-events: none;
    }
    .speck--1 { left: 16%; bottom: 22%; animation: twinkle 6.5s ease-in-out 1.8s infinite; }
    .speck--2 { left: 78%; bottom: 30%; animation: twinkle 5.2s ease-in-out 3.1s infinite; transform: scale(0.8); }
    .speck--3 { left: 58%; bottom: 12%; animation: twinkle 7.4s ease-in-out 2.3s infinite; transform: scale(0.65); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.85; }
    }

    /* ── Composition — a centered column that holds at any card ratio ── */
    .frame {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3.4vmin, 20px);
      padding: 6vmin;
    }

    /* the lockup — icon bound to the wordmark's em so it scales as one unit */
    .lockup {
      display: flex;
      align-items: center;
      gap: 0.3em;
      font-size: clamp(28px, 10vmin, 54px);
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
      animation: rise-settle 0.65s cubic-bezier(0.2, 0.6, 0.3, 1) 0.4s 1 forwards;
    }
    .lockup img {
      height: 1.16em;
      width: auto;
      display: block;
    }
    /* the wordmark carries a travelling sheen — light passing across the
       letterforms every 9s, via a background-clip gradient. At rest the
       gradient is plain white, so the text never reads as "gradient text". */
    .wordmark {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1em;
      letter-spacing: -0.025em;
      line-height: 1;
      color: transparent;
      background: linear-gradient(105deg,
        #fff 0%, #fff 42%,
        #cdbcff 47%, #f4efff 50%, #cdbcff 53%,
        #fff 58%, #fff 100%);
      background-size: 320% 100%;
      background-position: 115% 0;
      -webkit-background-clip: text;
      background-clip: text;
      animation: sheen 9s cubic-bezier(0.4, 0, 0.4, 1) 2.4s infinite;
    }
    @keyframes sheen {
      0%   { background-position: 115% 0; }
      16%  { background-position: -35% 0; }
      100% { background-position: -35% 0; }
    }
    @keyframes rise-settle {
      60%  { filter: blur(0); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* the two-tone line — muted clause, one brand phrase */
    .tagline {
      font-family: var(--sans);
      font-weight: 500;
      font-size: clamp(12px, 3.1vmin, 17px);
      letter-spacing: 0.002em;
      color: var(--chapter-muted);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.5s cubic-bezier(0.2, 0.6, 0.3, 1) 0.55s 1 forwards;
    }
    /* "proof." blooms softly on the same 8s breath as the glow behind it */
    .tagline b {
      font-weight: 500;
      color: var(--brand-dark);
      animation: proof-bloom 8s ease-in-out 1.85s infinite alternate;
    }
    @keyframes proof-bloom {
      0%   { text-shadow: 0 0 0 rgba(139, 111, 255, 0); }
      100% { text-shadow: 0 0 16px rgba(139, 111, 255, 0.55); }
    }

    /* the tick-rule — compass degree-ring, carrying the traveling pulse */
    .tick-rule {
      position: relative;
      width: min(62%, 460px);
      height: 7px;
      margin-top: clamp(6px, 2.6vmin, 16px);
      background:
        repeating-linear-gradient(90deg, var(--chapter-hairline) 0 1px, transparent 1px 8px) top / 100% 4px no-repeat,
        linear-gradient(var(--chapter-hairline), var(--chapter-hairline)) top / 100% 1px no-repeat;
      opacity: 0;
      transform: scaleX(0);
      animation: rule-draw 0.8s cubic-bezier(0.2, 0.6, 0.3, 1) 0.8s 1 forwards;
    }
    @keyframes rule-draw {
      30% { opacity: 1; }
      to  { opacity: 1; transform: scaleX(1); }
    }
    .tick-rule::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 26%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--spec-violet), var(--spec-cyan), transparent);
      opacity: 0;
      animation: pulse-sweep 8s cubic-bezier(0.4, 0, 0.4, 1) 1.6s infinite;
      will-change: transform, opacity;
    }
    @keyframes pulse-sweep {
      0%   { transform: translateX(-100%); opacity: 0; }
      6%   { opacity: 1; }
      34%  { opacity: 1; }
      40%  { transform: translateX(385%); opacity: 0; }
      100% { transform: translateX(385%); opacity: 0; }
    }

    /* the bearing — the HUD's spirit, miniaturized to a corner readout */
    .bearing {
      position: absolute;
      left: clamp(12px, 4vmin, 24px);
      bottom: clamp(10px, 3.4vmin, 20px);
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(9px, 2.2vmin, 11px);
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.38);
      font-variant-numeric: tabular-nums;
      opacity: 0;
      animation: fade 0.7s ease-out 1.1s 1 forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      to { opacity: 1; }
    }

    /* Static and still good: full composition, no motion, pulse hidden,
       bloom held at a quiet resting level. */
    @media (prefers-reduced-motion: reduce) {
      .aurora, .lockup, .tagline, .tick-rule, .bearing {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
      .bloom {
        animation: none;
        opacity: 0.7;
        transform: translate(-50%, -56%) scale(1);
      }
      .wordmark { animation: none; background-position: 115% 0; }
      .tagline b { animation: none; text-shadow: none; }
      .tick-rule::after { animation: none; opacity: 0; }
      .speck { animation: none; opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="aurora"></div>
  <span class="speck speck--1"></span>
  <span class="speck speck--2"></span>
  <span class="speck speck--3"></span>
  <div class="bloom"></div>

  <div class="frame">
    <div class="lockup">
      <img src="../compassstulogo.png" alt="">
      <span class="wordmark">CompassStu</span>
    </div>
    <p class="tagline">Learning that ends in <b>proof.</b></p>
    <div class="tick-rule"></div>
  </div>

  <span class="bearing" id="bearing">N 000°</span>

  <script>
    // One revolution per 36s — a reading instrument idling, not a spinner.
    // Time-driven (the HUD proper is scroll-driven, but a card has no scroll).
    (function () {
      var el = document.getElementById('bearing');
      if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (el) el.textContent = 'N 360°';
        return;
      }
      var start = performance.now();
      setInterval(function () {
        var deg = Math.floor(((performance.now() - start) / 36000) * 360) % 360 + 1;
        el.textContent = 'N ' + String(deg).padStart(3, '0') + '°';
      }, 250);
    })();
  </script>
</body>
</html>
