<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card poster — CompassStu</title>
  <!-- POSTER SOURCE, not a live embed. The homepage card's static poster
       (Images/card-posters/compassstu.jpg) is a headless screenshot of this
       file at 1170×900 (ratio 1.3 = the card's mobile ratio). It recomposes
       the v3-light intro as a CENTERED column — wordmark, tagline, compass
       rail, certificate — so the tile reads balanced at phone size, with the
       hero-field bloom wrapping the whole stack. All final-state, no
       animation: this exists to be photographed. Regenerate with a headless
       screenshot whenever the intro's design tokens change. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700&f[]=switzer@500,600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #FFFFFF;
      --ink: #14102B;
      --body: #3D3660;
      --muted: #9490AE;
      --hairline: rgba(20, 16, 43, 0.10);
      --hairline-strong: rgba(20, 16, 43, 0.17);
      --brand: #7A5CFF;
      --spec-violet: #8B5CF6;
      --spec-cyan: #22D3EE;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'Switzer', -apple-system, sans-serif;
      --display: 'Cabinet Grotesk', var(--sans);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
    }

    /* Bloom wraps the whole centered stack. Slightly below centre so the
       light pools around the certificate. */
    .hero-field {
      position: absolute;
      top: 55%; left: 50%;
      width: 120vmin;
      aspect-ratio: 1.15;
      transform: translate(-50%, -50%);
      opacity: 0.85;
      pointer-events: none;
      filter: blur(7vmin);
      /* hotspots distributed AROUND the centre so the glow wraps the stack
         symmetrically instead of pooling to one side */
      background:
        radial-gradient(closest-side at 50% 40%, #9668FF 0%, transparent 66%),
        radial-gradient(closest-side at 34% 62%, #6C6FE3 0%, transparent 58%),
        radial-gradient(closest-side at 66% 62%, #35CFEA 0%, transparent 56%);
    }

    .stack {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.4vmin;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 0.3em;
      font-size: 10vmin;
    }
    .lockup img { height: 1.16em; width: auto; display: block; }
    .wordmark {
      font-family: var(--display);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
      white-space: nowrap;
      color: var(--ink);
    }

    .tagline {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 3.6vmin;
      letter-spacing: -0.01em;
      color: var(--body);
    }
    .tagline b {
      font-weight: 600;
      color: var(--brand);
      text-shadow: 0 0 16px rgba(122, 92, 255, 0.4);
    }

    /* Compass rail — the instrument line, centered. Bearing sits at N 079°,
       the same number the certificate proves. */
    .rail { width: 40vmin; }
    .rail-line {
      height: 10px;
      background:
        repeating-linear-gradient(90deg, var(--hairline) 0 1px, transparent 1px 8px) top / 100% 5px no-repeat,
        repeating-linear-gradient(90deg, rgba(20, 16, 43, 0.15) 0 1px, transparent 1px 40px) top / 100% 8px no-repeat,
        linear-gradient(var(--hairline-strong), var(--hairline-strong)) top / 100% 1px no-repeat;
    }
    .rail-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 1.4vmin;
      font-family: var(--mono);
      font-weight: 500;
      font-size: 1.7vmin;
      letter-spacing: 0.1em;
      color: rgba(20, 16, 43, 0.35);
      font-variant-numeric: tabular-nums;
    }
    .rail-meta .live { color: rgba(20, 16, 43, 0.55); }

    .float-stack {
      position: relative;
      margin-top: 2.2vmin;
    }
    .cert-hint {
      position: absolute;
      top: -2.4em;
      left: -1.8em;
      font-size: 1.8vmin;
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      background: #fff;
      border-radius: 8px;
      padding: 0.9em 1.3em 2.2em;
      box-shadow:
        inset 0 0 0 1px rgba(20, 16, 43, 0.05),
        0 12px 32px rgba(20, 16, 43, 0.10);
      transform: rotate(-4deg);
      white-space: nowrap;
    }
    .score-card {
      position: relative;
      background: #fff;
      border-radius: 12px;
      padding: 4.4vmin 5vmin;
      min-width: 46vmin;
      box-shadow:
        inset 0 0 0 1px rgba(20, 16, 43, 0.05),
        0 1px 2px rgba(20, 16, 43, 0.05),
        0 12px 24px -8px rgba(20, 16, 43, 0.10),
        0 32px 64px -16px rgba(20, 16, 43, 0.18),
        0 0 80px rgba(79, 70, 229, 0.25);
    }
    .score-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.6em;
    }
    .score-label, .score-verified {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 1.9vmin;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .score-label { color: var(--muted); }
    .score-verified {
      display: flex;
      align-items: center;
      gap: 0.5em;
      letter-spacing: 0.14em;
      color: #1E9E6A;
    }
    .score-verified i {
      width: 0.6em; height: 0.6em;
      border-radius: 50%;
      background: #1E9E6A;
      box-shadow: 0 0 8px rgba(30, 158, 106, 0.5);
    }
    .score-num {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 9vmin;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.1;
      margin-top: 0.18em;
    }
    .score-num i {
      font-style: normal;
      font-size: 0.36em;
      color: var(--muted);
      letter-spacing: 0;
    }
    .score-bar {
      height: 0.9vmin;
      border-radius: 99px;
      background: rgba(20, 16, 43, 0.07);
      margin-top: 2.4vmin;
      overflow: hidden;
    }
    .score-bar i {
      display: block;
      height: 100%;
      width: 79%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--spec-violet), var(--spec-cyan));
    }
    .score-detail {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.4em;
      margin-top: 2.4vmin;
      padding-top: 2vmin;
      border-top: 1px solid rgba(20, 16, 43, 0.07);
      font-family: var(--mono);
      font-weight: 500;
      font-size: 1.9vmin;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .score-detail b { font-weight: 500; color: var(--body); }
    .score-detail span { color: var(--muted); }
  </style>
</head>

<body>
  <div class="hero-field"></div>
  <div class="stack">
    <div class="lockup">
      <img src="../compassstulogo.png" alt="">
      <span class="wordmark">CompassStu</span>
    </div>
    <p class="tagline">Learning that ends in <b>proof.</b></p>
    <div class="rail">
      <div class="rail-line"></div>
      <div class="rail-meta">
        <span>N 000°</span>
        <span class="live">N 079°</span>
      </div>
    </div>
    <div class="float-stack">
      <div class="cert-hint">Certificate · Verified</div>
      <div class="score-card">
        <div class="score-top">
          <span class="score-label">AI Evaluation</span>
          <span class="score-verified"><i></i>Verified</span>
        </div>
        <div class="score-num">79 <i>/ 100</i></div>
        <div class="score-bar"><i></i></div>
        <div class="score-detail"><b>21 points lost</b><span>pass 70 · no curve</span></div>
      </div>
    </div>
  </div>
</body>
</html>
