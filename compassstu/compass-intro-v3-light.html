<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro — CompassStu</title>
  <!-- CompassStu card intro, retheme v3 — LIGHT variant, fourth pass.
       Structure quotes the live landing hero (CompassStu Platform/index.html):
       both columns live inside ONE contained, centered grid (the hero's
       --maxw discipline) — type left, floating cards right, the hero-field
       glow attached to the CARD COLUMN, not the viewport edge. So the two
       halves stay in conversation at every card size; no dead gulf between.
       Guided Light: one settle, then only light moves. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700&f[]=switzer@500,600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #FFFFFF;
      --ink: #14102B;
      --body: #3D3660;
      --muted: #9490AE;
      --hairline: rgba(20, 16, 43, 0.10);
      --hairline-strong: rgba(20, 16, 43, 0.17);
      --brand: #7A5CFF;
      --kicker: #7D8799;
      --spec-violet: #8B5CF6;
      --spec-cyan: #22D3EE;
      --shadow-float: 0 24px 64px rgba(20, 16, 43, 0.14);
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --sans: 'Switzer', -apple-system, sans-serif;
      --display: 'Cabinet Grotesk', var(--sans);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── The contained hero grid — the --maxw discipline. Both columns
         live here, so they scale together and never drift apart. ──── */
    .inner {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(88%, 920px);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: clamp(20px, 7vw, 88px);
    }

    /* ── Left column: the type cluster ─────────────────────── */
    .copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(9px, 3vmin, 18px);
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 0.3em;
      font-size: clamp(23px, 9.6vmin, 58px);
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
      animation: rise-settle 0.65s cubic-bezier(0.2, 0.6, 0.3, 1) 0.45s 1 forwards;
    }
    .lockup img {
      height: 1.16em;
      width: auto;
      display: block;
    }
    .wordmark {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1em;
      letter-spacing: -0.025em;
      line-height: 1;
      white-space: nowrap;
      color: transparent;
      background: linear-gradient(105deg,
        var(--ink) 0%, var(--ink) 42%,
        #6C55E0 47%, #8B6FFF 50%, #6C55E0 53%,
        var(--ink) 58%, var(--ink) 100%);
      background-size: 320% 100%;
      background-position: 115% 0;
      -webkit-background-clip: text;
      background-clip: text;
      animation: sheen 9s cubic-bezier(0.4, 0, 0.4, 1) 2.4s infinite;
    }
    @keyframes sheen {
      0%   { background-position: 115% 0; }
      16%  { background-position: -35% 0; }
      100% { background-position: -35% 0; }
    }
    @keyframes rise-settle {
      60%  { filter: blur(0); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .tagline {
      font-family: var(--sans);
      font-weight: 500;
      font-size: clamp(13px, 3.9vmin, 22px);
      letter-spacing: -0.01em;
      line-height: 1.35;
      color: var(--body);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.5s cubic-bezier(0.2, 0.6, 0.3, 1) 0.6s 1 forwards;
    }
    .tagline b {
      font-weight: 600;
      color: var(--brand);
      animation: proof-bloom 8s ease-in-out 1.85s infinite alternate;
    }
    @keyframes proof-bloom {
      0%   { text-shadow: 0 0 0 rgba(122, 92, 255, 0); }
      100% { text-shadow: 0 0 16px rgba(122, 92, 255, 0.4); }
    }

    .rail {
      width: 100%;
      max-width: 380px;
      margin-top: clamp(6px, 2.4vmin, 14px);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
      animation: rule-draw 0.9s cubic-bezier(0.2, 0.6, 0.3, 1) 0.85s 1 forwards;
    }
    @keyframes rule-draw {
      30% { opacity: 1; }
      to  { opacity: 1; transform: scaleX(1); }
    }
    .rail-line {
      position: relative;
      height: 10px;
      /* clips the travelling pulse so it enters and leaves INSIDE the
         track instead of appearing beyond its ends */
      overflow: hidden;
      background:
        repeating-linear-gradient(90deg, var(--hairline) 0 1px, transparent 1px 8px) top / 100% 5px no-repeat,
        repeating-linear-gradient(90deg, rgba(20, 16, 43, 0.15) 0 1px, transparent 1px 40px) top / 100% 8px no-repeat,
        linear-gradient(var(--hairline-strong), var(--hairline-strong)) top / 100% 1px no-repeat;
    }
    .rail-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 26%;
      height: 1.5px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--spec-violet), var(--spec-cyan), transparent);
      opacity: 0;
      animation: pulse-sweep 8s cubic-bezier(0.4, 0, 0.4, 1) 1.8s infinite;
      will-change: transform, opacity;
    }
    @keyframes pulse-sweep {
      0%   { transform: translateX(-100%); opacity: 0; }
      6%   { opacity: 1; }
      34%  { opacity: 1; }
      40%  { transform: translateX(385%); opacity: 0; }
      100% { transform: translateX(385%); opacity: 0; }
    }
    .rail-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: clamp(5px, 1.6vmin, 9px);
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(8.5px, 2.2vmin, 11px);
      letter-spacing: 0.1em;
      color: rgba(20, 16, 43, 0.35);
      font-variant-numeric: tabular-nums;
    }
    .rail-meta .live { color: rgba(20, 16, 43, 0.55); }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Right column: the stage — glow attached to the cards ── */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vmin;
    }
    .hero-field {
      position: absolute;
      top: 50%; left: 50%;
      width: 165%;
      aspect-ratio: 1.15;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      filter: blur(clamp(22px, 6.5vmin, 54px));
      background:
        radial-gradient(closest-side at 55% 42%, #9668FF 0%, transparent 68%),
        radial-gradient(closest-side at 38% 64%, #6C6FE3 0%, transparent 62%),
        radial-gradient(closest-side at 78% 58%, #35CFEA 0%, transparent 58%);
      background-size: 135% 135%;
      animation:
        field-in 0.8s ease 0.6s 1 both,
        field-drift 23s ease-in-out 1.4s infinite alternate;
      will-change: transform, opacity, background-position;
    }
    @keyframes field-in {
      to { opacity: 0.85; }
    }
    @keyframes field-drift {
      0%   { background-position: 0% 0%;   transform: translate(-50%, -50%) scale(1); }
      100% { background-position: 85% 47%; transform: translate(-50%, -50%) scale(1.051); }
    }
    /* Touch devices: the background-position drift repaints a large blurred
       layer every frame (measured 33fps at 6× CPU throttle). Swap it for a
       transform-only breathe — compositor-composited, repaint-free — and
       give phones back their 60fps. At card size the difference is invisible. */
    @media (pointer: coarse) {
      .hero-field {
        animation:
          field-in 0.8s ease 0.6s 1 both,
          field-drift-lite 23s ease-in-out 1.4s infinite alternate;
      }
    }
    @keyframes field-drift-lite {
      0%   { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-47%, -52%) scale(1.08); }
    }

    .float-stack {
      position: relative;
      z-index: 2;
    }
    .cert-hint {
      position: absolute;
      top: -2.4em;
      left: 1.6em;
      font-size: clamp(8px, 2vmin, 10.5px);
      font-family: var(--mono);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      background: #fff;
      border-radius: 8px;
      padding: 0.9em 1.3em 2.2em;
      box-shadow:
        inset 0 0 0 1px rgba(20, 16, 43, 0.05),
        0 12px 32px rgba(20, 16, 43, 0.10);
      transform: rotate(-4deg);
      white-space: nowrap;
      animation: float-back 6s ease-in-out 1.2s infinite;
    }
    @keyframes float-back {
      0%, 100% { transform: rotate(-4deg) translateY(0); }
      50%      { transform: rotate(-4deg) translateY(-4px); }
    }
    .score-card {
      position: relative;
      background: #fff;
      border-radius: 12px;
      padding: clamp(14px, 4.2vmin, 28px) clamp(16px, 4.8vmin, 32px);
      min-width: clamp(150px, 46vmin, 260px);
      /* material: hairline ring + stacked shadows + the light it sits on */
      box-shadow:
        inset 0 0 0 1px rgba(20, 16, 43, 0.05),
        0 1px 2px rgba(20, 16, 43, 0.05),
        0 12px 24px -8px rgba(20, 16, 43, 0.10),
        0 32px 64px -16px rgba(20, 16, 43, 0.18),
        0 0 80px rgba(79, 70, 229, 0.25);
      opacity: 0;
      animation:
        card-in 0.6s cubic-bezier(0.2, 0.6, 0.3, 1) 0.75s 1 forwards,
        float-front 6s ease-in-out 1.35s infinite;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float-front {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    .score-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.6em;
    }
    .score-label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(7.5px, 2vmin, 10px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .score-verified {
      display: flex;
      align-items: center;
      gap: 0.5em;
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(7.5px, 2vmin, 10px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1E9E6A;
    }
    .score-verified i {
      width: 0.6em; height: 0.6em;
      border-radius: 50%;
      background: #1E9E6A;
      box-shadow: 0 0 8px rgba(30, 158, 106, 0.5);
    }
    .score-num {
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(30px, 9vmin, 56px);
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.1;
      margin-top: 0.18em;
    }
    .score-num i {
      font-style: normal;
      font-size: 0.36em;
      color: var(--muted);
      letter-spacing: 0;
    }
    /* the jewelry — the proof-score bar, light filling to 79 on load */
    .score-bar {
      height: clamp(3px, 0.9vmin, 5px);
      border-radius: 99px;
      background: rgba(20, 16, 43, 0.07);
      margin-top: clamp(8px, 2.4vmin, 14px);
      overflow: hidden;
    }
    .score-bar i {
      display: block;
      height: 100%;
      width: 79%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--spec-violet), var(--spec-cyan));
      transform: translateX(-101%);
      animation: bar-fill 1.1s cubic-bezier(0.2, 0.6, 0.3, 1) 1.25s 1 forwards;
    }
    @keyframes bar-fill {
      to { transform: translateX(0); }
    }
    .score-detail {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1.4em;
      margin-top: clamp(8px, 2.4vmin, 14px);
      padding-top: clamp(7px, 2vmin, 12px);
      border-top: 1px solid rgba(20, 16, 43, 0.07);
      font-family: var(--mono);
      font-weight: 500;
      font-size: clamp(7.5px, 2vmin, 10px);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .score-detail b { font-weight: 500; color: var(--body); }
    .score-detail span { color: var(--muted); }

    /* narrow cards: both columns compact so they still share the row —
       the card gives up its detail row, the type steps down one size */
    @media (max-width: 430px) {
      .inner { width: 93%; grid-template-columns: auto auto; justify-content: space-between; gap: 12px; }
      .cert-hint { display: none; }
      .lockup { font-size: 20px; }
      .tagline { font-size: 12px; }
      .rail { max-width: 150px; }
      .rail-meta { font-size: 8px; }
      .score-detail { display: none; }
      .score-card { min-width: 0; padding: 12px 14px; }
      .score-num { font-size: 26px; }
      .score-top { gap: 1em; }
      .score-label, .score-verified { font-size: 7px; }
      .stage { min-height: 0; }
      .hero-field { width: 220%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lockup, .tagline, .rail {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }
      .rail { transform: scaleX(1); }
      .hero-field { animation: none; opacity: 0.85; }
      .score-card, .cert-hint { animation: none; opacity: 1; }
      .score-bar i { animation: none; transform: translateX(0); }
      .wordmark { animation: none; background-position: 115% 0; }
      .tagline b { animation: none; text-shadow: none; }
      .rail-line::after { animation: none; opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="inner">

    <div class="copy">
      <div class="lockup">
        <img src="../compassstulogo.png" alt="">
        <span class="wordmark">CompassStu</span>
      </div>
      <p class="tagline">Learning that ends in <b>proof.</b></p>
      <div class="rail">
        <div class="rail-line"></div>
        <div class="rail-meta">
          <span>N 000°</span>
          <span class="live" id="bearing">N 000°</span>
        </div>
      </div>
    </div>

    <div class="stage">
      <div class="hero-field"></div>
      <div class="float-stack">
        <div class="cert-hint">Certificate · Verified</div>
        <div class="score-card">
          <div class="score-top">
            <span class="score-label">AI Evaluation</span>
            <span class="score-verified"><i></i>Verified</span>
          </div>
          <div class="score-num">79 <i>/ 100</i></div>
          <div class="score-bar"><i></i></div>
          <div class="score-detail"><b>21 points lost</b><span>pass 70 · no curve</span></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      var el = document.getElementById('bearing');
      if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (el) el.textContent = 'N 360°';
        return;
      }
      var start = performance.now();
      setInterval(function () {
        var deg = Math.floor(((performance.now() - start) / 36000) * 360) % 360 + 1;
        el.textContent = 'N ' + String(deg).padStart(3, '0') + '°';
      }, 250);
    })();
  </script>
</body>
</html>
